<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>罗盘</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
</style>
</head>
<body>
<canvas id="dial"></canvas>
<script>
(function () {
  'use strict';

  var cv = document.getElementById('dial');
  var ctx = cv.getContext('2d');
  var SIZE = 700, C = 350, R = 300;
  var scale = 1;
  var heading = null;
  var target = null;
  var aligned = false;
  var lastDraw = 0;
  var lastAbs = 0;
  var lastMessageAt = 0;

  function norm(h) { return ((h % 360) + 360) % 360; }
  function finite(n) { return typeof n === 'number' && isFinite(n); }

  function resize() {
    var rect = cv.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    cv.width = Math.max(1, Math.round(rect.width * dpr));
    cv.height = Math.max(1, Math.round(rect.width * dpr));
    scale = cv.width / SIZE;
  }

  function setHeading(h) {
    heading = norm(h);
  }

  /* ---------- 传感器：iframe 自己能拿到就用，拿不到等父页面转发 ---------- */

  function onOrient(e, isAbs) {
    var now = performance.now();
    if (now - lastMessageAt < 1000) return; // 父页面在转发时，以父页面为准
    if (!isAbs && now - lastAbs < 600) return;

    var h = null;
    var absolute = false;

    if (finite(e.webkitCompassHeading)) {
      h = e.webkitCompassHeading;
      absolute = true;
    } else if (finite(e.alpha)) {
      absolute = (e.absolute === true) || isAbs;
      h = 360 - e.alpha;
    }

    if (!finite(h)) return;
    if (absolute) lastAbs = now;
    setHeading(h);
  }

  window.addEventListener('deviceorientationabsolute', function (e) { onOrient(e, true); }, true);
  window.addEventListener('deviceorientation', function (e) { onOrient(e, false); }, true);

  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.type === 'heading' && finite(d.h)) {
      lastMessageAt = performance.now();
      setHeading(d.h);
    }
    if (d.type === 'target') target = finite(d.t) ? norm(d.t) : null;
    if (d.type === 'aligned') aligned = !!d.v;
    if (d.type === 'reset') { heading = null; target = null; aligned = false; }
    if (d.type === 'resize') { resize(); draw(); }
    if (d.type === 'render') draw();
  });

  /* ---------- 绘制：和 compass-test 同一套 30fps ---------- */

  function draw() {
    var live = heading !== null;
    var h = live ? heading : 0;

    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.clearRect(0, 0, SIZE, SIZE);

    // 外圈
    ctx.beginPath();
    ctx.arc(C, C, R + 28, 0, Math.PI * 2);
    ctx.fillStyle = '#080a0d';
    ctx.fill();
    ctx.strokeStyle = '#1d2228';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 顶端固定指标
    ctx.beginPath();
    ctx.moveTo(C, C - R - 4);
    ctx.lineTo(C - 15, C - R - 32);
    ctx.lineTo(C + 15, C - R - 32);
    ctx.closePath();
    ctx.fillStyle = aligned ? '#79b473' : (live ? '#8b806c' : '#3a3f47');
    ctx.fill();

    ctx.save();
    ctx.translate(C, C);
    ctx.rotate(-h * Math.PI / 180);

    // 盘面
    var g = ctx.createRadialGradient(0, -R * 0.3, R * 0.05, 0, 0, R);
    g.addColorStop(0, '#1b2027');
    g.addColorStop(0.7, '#12161b');
    g.addColorStop(1, '#0c0f13');
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = '#2c333b';
    ctx.lineWidth = 3;
    ctx.stroke();

    // 刻度
    for (var d = 0; d < 360; d += 5) {
      var a = (d - 90) * Math.PI / 180;
      var major = d % 90 === 0;
      var mid = d % 30 === 0;
      var outer = R - 12;
      var inner = R - (major ? 40 : mid ? 26 : 14);
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * outer, Math.sin(a) * outer);
      ctx.lineTo(Math.cos(a) * inner, Math.sin(a) * inner);
      ctx.strokeStyle = major ? '#e6e0d2' : mid ? '#79828d' : '#39404a';
      ctx.lineWidth = major ? 5 : mid ? 3 : 1.5;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    // 度数
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '500 22px ui-monospace, Menlo, Consolas, monospace';
    for (var dd = 0; dd < 360; dd += 30) {
      if (dd % 90 === 0) continue;
      var aa = (dd - 90) * Math.PI / 180;
      var rr = R - 82;
      ctx.save();
      ctx.translate(Math.cos(aa) * rr, Math.sin(aa) * rr);
      ctx.rotate(dd * Math.PI / 180);
      ctx.fillStyle = '#6b7480';
      ctx.fillText(String(dd), 0, 0);
      ctx.restore();
    }

    // 方位字
    var cards = [['N', 0, '#d6d0c2'], ['E', 90, '#d6d0c2'], ['S', 180, '#d6d0c2'], ['W', 270, '#d6d0c2']];
    for (var i = 0; i < cards.length; i++) {
      var t = cards[i][0], deg = cards[i][1], col = cards[i][2];
      var ang = (deg - 90) * Math.PI / 180;
      var rad = R - 58;
      ctx.save();
      ctx.translate(Math.cos(ang) * rad, Math.sin(ang) * rad);
      ctx.rotate(deg * Math.PI / 180);
      ctx.fillStyle = col;
      ctx.font = '700 44px -apple-system, "PingFang SC", sans-serif';
      ctx.fillText(t, 0, 0);
      ctx.restore();
    }

    // 指针：屏幕角 = target - heading，画在已转 -heading 的坐标系里就是 target
    if (target !== null) {
      ctx.save();
      ctx.rotate(target * Math.PI / 180);

      // 尾针
      ctx.beginPath();
      ctx.moveTo(0, 14);
      ctx.lineTo(7, R - 40);
      ctx.lineTo(-7, R - 40);
      ctx.closePath();
      ctx.fillStyle = 'rgba(232, 176, 75, 0.28)';
      ctx.fill();

      // 红针
      ctx.beginPath();
      ctx.moveTo(0, -R + 20);
      ctx.lineTo(9, 20);
      ctx.lineTo(0, 7);
      ctx.lineTo(-9, 20);
      ctx.closePath();
      ctx.fillStyle = '#d9534f';
      ctx.fill();
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // 目标点
      ctx.beginPath();
      ctx.arc(0, -R + 20, 5, 0, Math.PI * 2);
      ctx.strokeStyle = '#e8b04b';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.restore();
    }

    // 中心帽
    ctx.beginPath();
    ctx.arc(0, 0, 8, 0, Math.PI * 2);
    ctx.fillStyle = '#e8b04b';
    ctx.fill();
    ctx.strokeStyle = '#4a3a18';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.restore();
  }

  function loop(t) {
    requestAnimationFrame(loop);
    if (t - lastDraw < 33) return;
    lastDraw = t;
    draw();
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });
  resize();
  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
