<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>罗盘</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: transparent; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  body.solo { background: #0b0d10; }

  /* 盘面固定不动；只有指针转。手机转，指针跟着转，盘面像实体罗盘的壳。 */
  .stage { position: relative; width: min(100vw, 560px); aspect-ratio: 1; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .needle {
    position: absolute; inset: 0; width: 100%; height: 100%; display: block;
    transform-origin: 50% 50%;
    transition: transform .28s ease-out;
    will-change: transform;
    pointer-events: none;
    opacity: 0;
  }
  .needle.on { opacity: 1; }
  .tail { fill: rgba(232, 176, 75, .28); }
  .main { fill: #d9534f; stroke: rgba(0, 0, 0, .35); stroke-width: 1; }
  .tip { fill: none; stroke: #e8b04b; stroke-width: 2; }
  .cap { fill: #e8b04b; stroke: #4a3a18; stroke-width: 2; }

  .name {
    margin: 14px 0 0; color: #e8e6e1; letter-spacing: .08em;
    font: 600 18px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  }
  .status { min-height: 18px; margin: 8px 0 0; color: #8a8578; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
  .start {
    position: absolute; left: 50%; top: 50%; z-index: 2;
    min-width: 120px; min-height: 48px; padding: 0 22px;
    transform: translate(-50%, -50%);
    border: 1px solid #3a3020; border-radius: 999px;
    background: radial-gradient(circle at 50% 38%, #2c2417, #14110b);
    color: #e8b04b; font: 600 16px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    box-shadow: 0 0 0 8px rgba(232, 176, 75, .04), 0 10px 34px rgba(0, 0, 0, .65);
  }
  .back {
    min-height: 44px; margin-top: 14px; padding: 0 20px;
    border: 1px solid #2c323a; border-radius: 999px; background: #11151a;
    color: #a8a296; font: 600 14px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="stage">
  <canvas id="dial"></canvas>
  <svg id="needle" class="needle" viewBox="0 0 700 700" aria-hidden="true">
    <polygon class="tail" points="350,364 357,610 343,610"></polygon>
    <polygon class="main" points="350,80 359,370 350,357 341,370"></polygon>
    <circle class="tip" cx="350" cy="80" r="5"></circle>
    <circle class="cap" cx="350" cy="350" r="8"></circle>
  </svg>
  <button id="start" class="start" hidden>开始</button>
</div>
<p id="name" class="name" hidden></p>
<p id="status" class="status" hidden></p>
<button id="back" class="back" hidden>返回游戏</button>

<script>
(function () {
  'use strict';

  var cv = document.getElementById('dial');
  var ctx = cv.getContext('2d');
  var needle = document.getElementById('needle');
  var SIZE = 700, C = 350, R = 300;
  var scale = 1;
  var heading = null;
  var target = null;
  var aligned = false;
  var lastAbs = 0;
  var lastMessageAt = 0;

  function norm(h) { return ((h % 360) + 360) % 360; }
  function finite(n) { return typeof n === 'number' && isFinite(n); }

  // 独立打开时是自己的一页（全屏罗盘）；嵌在游戏页里时由父页面转发数据
  var solo = window.parent === window;
  var startBtn = document.getElementById('start');
  var nameEl = document.getElementById('name');
  var statusEl = document.getElementById('status');
  var backBtn = document.getElementById('back');
  var query = new URLSearchParams(location.search);
  var destLat = parseFloat(query.get('destLat') || '');
  var destLon = parseFloat(query.get('destLon') || '');

  if (solo) document.body.classList.add('solo');
  if (query.has('target')) {
    var qt = parseFloat(query.get('target'));
    if (finite(qt)) target = norm(qt);
  }
  if (query.has('name')) {
    nameEl.textContent = query.get('name');
    nameEl.hidden = false;
  }
  if (solo) {
    startBtn.hidden = false;
    backBtn.hidden = false;
  }

  backBtn.addEventListener('click', function () {
    // 返回游戏时带上 resume=1，由游戏页恢复刚才的存档
    location.href = './?resume=1';
  });

  /* ---------- 静态盘面：只在尺寸或对准状态变化时画一次 ---------- */

  function resize() {
    var rect = cv.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    cv.width = Math.max(1, Math.round(rect.width * dpr));
    cv.height = Math.max(1, Math.round(rect.width * dpr));
    scale = cv.width / SIZE;
    drawDial();
  }

  function drawDial() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.clearRect(0, 0, SIZE, SIZE);

    // 外圈
    ctx.beginPath();
    ctx.arc(C, C, R + 28, 0, Math.PI * 2);
    ctx.fillStyle = '#080a0d';
    ctx.fill();
    ctx.strokeStyle = '#1d2228';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 顶端固定指标
    ctx.beginPath();
    ctx.moveTo(C, C - R - 4);
    ctx.lineTo(C - 15, C - R - 32);
    ctx.lineTo(C + 15, C - R - 32);
    ctx.closePath();
    ctx.fillStyle = aligned ? '#79b473' : '#8b806c';
    ctx.fill();

    // 盘面
    var g = ctx.createRadialGradient(0, -R * 0.3, R * 0.05, 0, 0, R);
    g.addColorStop(0, '#1b2027');
    g.addColorStop(0.7, '#12161b');
    g.addColorStop(1, '#0c0f13');
    ctx.beginPath();
    ctx.arc(C, C, R, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = '#2c333b';
    ctx.lineWidth = 3;
    ctx.stroke();

    // 刻度
    for (var d = 0; d < 360; d += 5) {
      var a = (d - 90) * Math.PI / 180;
      var major = d % 90 === 0;
      var mid = d % 30 === 0;
      var outer = R - 12;
      var inner = R - (major ? 40 : mid ? 26 : 14);
      ctx.beginPath();
      ctx.moveTo(C + Math.cos(a) * outer, C + Math.sin(a) * outer);
      ctx.lineTo(C + Math.cos(a) * inner, C + Math.sin(a) * inner);
      ctx.strokeStyle = major ? '#e6e0d2' : mid ? '#79828d' : '#39404a';
      ctx.lineWidth = major ? 5 : mid ? 3 : 1.5;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    // 度数
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '500 22px ui-monospace, Menlo, Consolas, monospace';
    for (var dd = 0; dd < 360; dd += 30) {
      if (dd % 90 === 0) continue;
      var aa = (dd - 90) * Math.PI / 180;
      var rr = R - 82;
      ctx.save();
      ctx.translate(C + Math.cos(aa) * rr, C + Math.sin(aa) * rr);
      ctx.rotate(dd * Math.PI / 180);
      ctx.fillStyle = '#6b7480';
      ctx.fillText(String(dd), 0, 0);
      ctx.restore();
    }

    // 方位字
    var cards = [['N', 0, '#d6d0c2'], ['E', 90, '#d6d0c2'], ['S', 180, '#d6d0c2'], ['W', 270, '#d6d0c2']];
    for (var i = 0; i < cards.length; i++) {
      var t = cards[i][0], deg = cards[i][1], col = cards[i][2];
      var ang = (deg - 90) * Math.PI / 180;
      var rad = R - 58;
      ctx.save();
      ctx.translate(C + Math.cos(ang) * rad, C + Math.sin(ang) * rad);
      ctx.rotate(deg * Math.PI / 180);
      ctx.fillStyle = col;
      ctx.font = '700 44px -apple-system, "PingFang SC", sans-serif';
      ctx.fillText(t, 0, 0);
      ctx.restore();
    }
  }

  /* ---------- 指针：唯一会动的东西 ---------- */

  function applyNeedle() {
    if (heading === null || target === null) {
      needle.classList.remove('on');
      return;
    }
    needle.classList.add('on');
    needle.style.transform = 'rotate(' + norm(target - heading).toFixed(2) + 'deg)';
  }

  function setHeading(h) {
    heading = norm(h);
  }

  /* ---------- 传感器 ---------- */

  function onOrient(e, isAbs) {
    var now = performance.now();
    if (now - lastMessageAt < 1000) return; // 父页面在转发时，以父页面为准
    if (!isAbs && now - lastAbs < 600) return;

    var h = null;
    var absolute = false;

    if (finite(e.webkitCompassHeading)) {
      h = e.webkitCompassHeading;
      absolute = true;
    } else if (finite(e.alpha)) {
      absolute = (e.absolute === true) || isAbs;
      h = 360 - e.alpha;
    }

    if (!finite(h)) return;
    if (absolute) lastAbs = now;
    setHeading(h);
  }

  window.addEventListener('deviceorientationabsolute', function (e) { onOrient(e, true); }, true);
  window.addEventListener('deviceorientation', function (e) { onOrient(e, false); }, true);

  /* ---------- 父页面消息 ---------- */

  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.type === 'heading' && finite(d.h)) {
      lastMessageAt = performance.now();
      setHeading(d.h);
    }
    if (d.type === 'target') target = finite(d.t) ? norm(d.t) : null;
    if (d.type === 'aligned') {
      var v = !!d.v;
      if (v !== aligned) { aligned = v; drawDial(); }
    }
    if (d.type === 'resize') { resize(); applyNeedle(); }
    if (d.type === 'render') applyNeedle();
  });

  /* ---------- GPS：独立页自己算目的地方位 ---------- */

  function bearingTo(lat1, lon1, lat2, lon2) {
    var p1 = lat1 * Math.PI / 180;
    var p2 = lat2 * Math.PI / 180;
    var dl = (lon2 - lon1) * Math.PI / 180;
    var y = Math.sin(dl) * Math.cos(p2);
    var x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
    return norm(Math.atan2(y, x) * 180 / Math.PI);
  }

  var gpsStarted = false;
  function startGps() {
    if (gpsStarted || !solo || !finite(destLat) || !finite(destLon)) return;
    if (!navigator.geolocation) {
      statusEl.hidden = false;
      statusEl.textContent = '定位不可用';
      return;
    }
    gpsStarted = true;
    statusEl.hidden = false;
    statusEl.textContent = '定位中…';
    navigator.geolocation.watchPosition(function (pos) {
      target = bearingTo(pos.coords.latitude, pos.coords.longitude, destLat, destLon);
      statusEl.textContent = '已定位';
    }, function () {
      statusEl.textContent = '定位不可用';
    }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 });
  }

  function begin() {
    startBtn.hidden = true;
    startGps();
  }

  startBtn.addEventListener('click', function () {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(function (res) {
        if (res === 'granted') begin();
      }).catch(function () {});
    } else {
      begin();
    }
  });

  /* ---------- 启动：没有 rAF，只有 10Hz 指针更新 ---------- */

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });

  resize();
  setInterval(applyNeedle, 100);
})();
</script>
</body>
</html>
